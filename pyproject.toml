[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-failure-atlas"
version = "0.2.0"
description = "Trace-level security and reliability analysis for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Justin Meister", email = "justin@solsticestudio.ai" }
]
keywords = [
  "ai-agents", "agent-traces", "hugging-face", "evaluation",
  "security", "observability", "red-teaming"
]
dependencies = [
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
  "PyYAML>=6.0,<7",
  "huggingface-hub>=0.27",
]

[project.optional-dependencies]
space = ["gradio>=5,<7", "pandas>=2.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8"]

[project.scripts]
agent-atlas = "agent_failure_atlas.cli:app"

[project.urls]
Homepage = "https://github.com/Solasticeaistudio/agent-failure-atlas"
Repository = "https://github.com/Solasticeaistudio/agent-failure-atlas"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E402", "UP042"]
