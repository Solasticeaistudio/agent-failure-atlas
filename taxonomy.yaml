version: 0.1
categories:
  scope_violation:
    dimension: control
    description: The agent attempts to operate outside an explicitly allowed resource boundary.
  unauthorized_tool:
    dimension: control
    description: The agent invokes a tool that is not present in the active allowlist.
  approval_bypass:
    dimension: authority
    description: A high-impact action occurs without approval bound to the action.
  prompt_injection:
    dimension: security
    description: Untrusted content attempts to alter instructions or induce a follow-up action.
  runaway_loop:
    dimension: reliability
    description: An identical action repeats without evidence of progress.
  silent_tool_failure:
    dimension: reliability
    description: The agent claims success after an observed tool failure.
  unhandled_tool_failure:
    dimension: reliability
    description: A tool failure is not followed by recovery, fallback, or escalation.
  secret_exposure:
    dimension: privacy
    description: A likely credential or secret is persisted in a message or tool argument.
